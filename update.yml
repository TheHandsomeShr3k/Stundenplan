name: Stundenplan aktualisieren

# Laeuft taeglich um 04:00 UTC (= 05:00/06:00 deutsche Zeit) und manuell per Knopf
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}   # erlaubt manuelles Starten im "Actions"-Tab

permissions:
  contents: write   # damit der Workflow data.json zurueck ins Repo schreiben darf

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pdfplumber installieren
        run: pip install pdfplumber

      - name: PDFs parsen -> data.json
        run: python parse_pdfs.py

      - name: data.json committen (nur bei Aenderung)
        run: |
          git config user.name "stundenplan-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "Keine Aenderungen am Plan."
          else
            git commit -m "Stundenplan aktualisiert ($(date -u +%Y-%m-%d))"
            git push
          fi

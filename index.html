<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>WVS2024/4 · Stundenplan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --display: "Bricolage Grotesque", "Space Grotesk", sans-serif;
    --body: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  html[data-theme="dark"] {
    --bg: #0a0e17; --bg-2: #0f1421; --card: #151b2b; --card-hi: #1b2336;
    --line: #232c42; --txt: #eef2fb; --muted: #8a96b2; --dim: #5b6884;
    --accent: #5b8cff; --accent-2: #8b6cff; --live: #2fd47a; --exam: #ff6b6b; --warn: #ffb454;
    --shadow: 0 8px 40px rgba(0,0,0,0.5); --track: #232c42;
  }
  html[data-theme="light"] {
    --bg: #f4f6fc; --bg-2: #eaeef8; --card: #ffffff; --card-hi: #f7f9ff;
    --line: #e1e6f2; --txt: #14192a; --muted: #59617a; --dim: #97a0b8;
    --accent: #3a6dff; --accent-2: #7a52ff; --live: #16a85c; --exam: #e0455a; --warn: #c77d1a;
    --shadow: 0 6px 28px rgba(60,80,140,0.12); --track: #e7ebf6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); }
  body {
    font-family: var(--body); color: var(--txt); min-height: 100vh;
    padding: max(20px, env(safe-area-inset-top)) 20px calc(110px + env(safe-area-inset-bottom));
    background:
      radial-gradient(1100px 600px at 90% -5%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 60%),
      radial-gradient(900px 500px at -10% 10%, color-mix(in srgb, var(--accent-2) 12%, transparent), transparent 55%),
      var(--bg);
    max-width: 760px; margin: 0 auto; line-height: 1.5;
    transition: background .3s, color .3s;
  }
  body.wide { max-width: 1000px; }
  .header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 6px; }
  .header h1 { font-family: var(--display); font-weight: 800; font-size: 1.6rem; letter-spacing: -0.02em; }
  .header .kurs { color: var(--accent); }
  .theme-btn { background: var(--card); border: 1px solid var(--line); color: var(--txt); width: 46px; height: 46px; border-radius: 13px; font-size: 1.3rem; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all .2s; }
  .theme-btn:active { transform: scale(0.92); }
  .clock { color: var(--muted); font-size: 0.9rem; margin-bottom: 24px; font-variant-numeric: tabular-nums; }
  .tabs { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom)); display: flex; gap: 6px; z-index: 50; background: color-mix(in srgb, var(--card) 85%, transparent); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid var(--line); border-radius: 18px; padding: 7px; box-shadow: var(--shadow); }
  .tabs button { font-family: var(--body); font-size: 0.98rem; font-weight: 600; color: var(--muted); background: transparent; border: none; padding: 12px 26px; border-radius: 13px; cursor: pointer; transition: all .18s; }
  .tabs button.active { color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
  .view { animation: fade .35s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .hero { background: linear-gradient(150deg, var(--card-hi), var(--card)); border: 1px solid var(--line); border-radius: 22px; padding: 24px; margin-bottom: 16px; position: relative; overflow: hidden; }
  .hero.live { border-color: color-mix(in srgb, var(--live) 40%, var(--line)); }
  .badge { display: inline-flex; align-items: center; gap: 8px; font-size: 0.74rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--live); margin-bottom: 14px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--live); animation: pulse 2s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--live) 50%,transparent);} 70%{box-shadow:0 0 0 11px transparent;} 100%{box-shadow:0 0 0 0 transparent;} }
  .hero .fach { font-family: var(--display); font-weight: 800; font-size: 2.1rem; letter-spacing: -0.02em; line-height: 1.08; display: flex; align-items: center; gap: 12px; }
  .hero .fach .swatch { width: 14px; height: 30px; border-radius: 6px; flex-shrink: 0; }
  .hero .meta { color: var(--muted); margin-top: 10px; font-size: 1rem; }
  .hero .meta b { color: var(--txt); font-weight: 600; }
  .hero .empty-big { font-family: var(--display); font-weight: 800; font-size: 1.7rem; display: block; margin-bottom: 6px; }
  .hero .empty-sub { color: var(--muted); font-size: 1.05rem; }
  .progress { margin-top: 18px; }
  .progress .bar { height: 8px; background: var(--track); border-radius: 99px; overflow: hidden; }
  .progress .fill { height: 100%; background: linear-gradient(90deg, var(--live), color-mix(in srgb, var(--live) 60%, var(--accent))); border-radius: 99px; transition: width .6s ease; }
  .progress .lbl { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--muted); margin-top: 7px; font-variant-numeric: tabular-nums; }
  .examalert { display: flex; align-items: center; gap: 14px; background: linear-gradient(135deg, color-mix(in srgb,var(--exam) 16%, var(--card)), var(--card)); border: 1px solid color-mix(in srgb,var(--exam) 35%, var(--line)); border-radius: 16px; padding: 15px 18px; margin-bottom: 16px; }
  .examalert .ic { font-size: 1.5rem; }
  .examalert .t1 { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--exam); font-weight: 700; }
  .examalert .t2 { font-weight: 600; font-size: 1.02rem; margin-top: 2px; }
  .examalert .cd { margin-left: auto; text-align: right; font-family: var(--display); font-weight: 800; color: var(--exam); font-size: 1.15rem; white-space: nowrap; }
  .examalert .cd span { display: block; font-size: 0.7rem; color: var(--muted); font-weight: 500; }
  .label { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); margin: 24px 4px 12px; font-weight: 700; }
  .row { display: flex; gap: 14px; align-items: stretch; background: var(--card); border: 1px solid var(--line); border-radius: 15px; padding: 15px 16px; margin-bottom: 10px; position: relative; overflow: hidden; }
  .row .stripe { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; }
  .row .time { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 0.95rem; color: var(--accent); min-width: 54px; padding-left: 6px; }
  .row .time .end { display: block; color: var(--dim); font-weight: 500; font-size: 0.8rem; }
  .row .body { flex: 1; min-width: 0; }
  .row .body .f { font-weight: 600; font-size: 1.05rem; }
  .row .body .d { color: var(--muted); font-size: 0.88rem; margin-top: 2px; }
  .row .body .r { color: var(--dim); }
  .row.now { border-color: color-mix(in srgb,var(--live) 50%, var(--line)); background: linear-gradient(120deg, color-mix(in srgb,var(--live) 8%, var(--card)), var(--card)); }
  .row.now .nowtag { font-size: 0.68rem; font-weight: 700; color: var(--live); text-transform: uppercase; letter-spacing: 0.05em; }
  .row.special { opacity: 0.55; }
  .row.special .time { color: var(--dim); }
  .row.examrow { border-color: color-mix(in srgb,var(--exam) 35%, var(--line)); background: linear-gradient(120deg, color-mix(in srgb,var(--exam) 9%, var(--card)), var(--card)); }
  .row.examrow .time, .row.examrow .body .f { color: var(--exam); }
  .exam { background: linear-gradient(150deg, color-mix(in srgb,var(--exam) 8%, var(--card)), var(--card)); border: 1px solid color-mix(in srgb,var(--exam) 25%, var(--line)); border-radius: 17px; padding: 17px 19px; margin-bottom: 12px; }
  .exam .top-line { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .exam .dt { font-family: var(--display); font-weight: 800; font-size: 1.15rem; color: var(--exam); }
  .exam .cd { font-size: 0.8rem; color: var(--warn); font-weight: 600; white-space: nowrap; }
  .exam .mod { font-weight: 600; margin-top: 8px; font-size: 1.06rem; }
  .exam .sub { color: var(--muted); font-size: 0.88rem; margin-top: 5px; }
  .exam .grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .exam .chip { font-size: 0.8rem; background: var(--card-hi); border: 1px solid var(--line); color: var(--muted); padding: 5px 11px; border-radius: 9px; }
  .exam .chip b { color: var(--txt); font-weight: 600; }
  .exam.soft { background: var(--card); border-color: var(--line); }
  .exam.soft .dt { color: var(--muted); font-size: 0.98rem; }
  .weeknav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; gap: 10px; }
  .weeknav button { background: var(--card); border: 1px solid var(--line); color: var(--txt); width: 46px; height: 46px; border-radius: 13px; font-size: 1.3rem; cursor: pointer; }
  .weeknav button:active { transform: scale(0.92); }
  .weeknav .wk { font-family: var(--display); font-weight: 700; text-align: center; }
  .weeknav .wk span { color: var(--dim); font-weight: 400; font-size: 0.82rem; display: block; }
  .weekgrid { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 720px) { .weekgrid { grid-template-columns: repeat(5, 1fr); gap: 12px; align-items: start; } }
  .day h3 { font-family: var(--display); font-weight: 700; font-size: 1rem; margin-bottom: 10px; padding-left: 2px; }
  .day h3.today { color: var(--accent); }
  .day h3 span { color: var(--dim); font-weight: 500; font-size: 0.84rem; }
  @media (min-width: 720px) {
    .day h3 { font-size: 0.9rem; }
    .weekgrid .row { flex-direction: column; gap: 6px; padding: 12px 12px 12px 16px; }
    .weekgrid .row .time { min-width: 0; font-size: 0.82rem; }
    .weekgrid .row .time .end { display: inline; }
    .weekgrid .row .body .f { font-size: 0.92rem; }
    .weekgrid .row .body .d { font-size: 0.8rem; }
  }
  .day .nothing { color: var(--dim); font-size: 0.85rem; padding: 8px 2px; font-style: italic; }
  .status { text-align: center; color: var(--muted); padding: 50px 20px; }
  .spinner { width: 32px; height: 32px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .err-box { background: color-mix(in srgb,var(--exam) 8%, var(--card)); border: 1px solid color-mix(in srgb,var(--exam) 30%, var(--line)); border-radius: 15px; padding: 20px; font-size: 0.92rem; }
  .err-box code { background: var(--bg-2); padding: 2px 6px; border-radius: 5px; }
  .stand { font-size: 0.74rem; color: var(--dim); text-align: right; margin-top: 22px; }
  .offline { background: color-mix(in srgb,var(--warn) 14%, var(--card)); border: 1px solid color-mix(in srgb,var(--warn) 35%, var(--line)); color: var(--txt); border-radius: 12px; padding: 10px 14px; font-size: 0.85rem; margin-bottom: 14px; }
  /* NOTEN */
  .gpa-cards { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 22px; }
  @media (min-width: 480px) { .gpa-cards { grid-template-columns: 1fr 1fr; } }
  .gpa { background: linear-gradient(150deg, var(--card-hi), var(--card)); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px; }
  .gpa .t { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 700; }
  .gpa .v { font-family: var(--display); font-weight: 800; font-size: 2.4rem; line-height: 1; margin-top: 8px; }
  .gpa .sub { color: var(--dim); font-size: 0.78rem; margin-top: 6px; }
  .gpa.total .v { color: var(--accent); }
  .sem { background: var(--card); border: 1px solid var(--line); border-radius: 17px; padding: 16px 16px 8px; margin-bottom: 14px; }
  .sem .shead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 10px; }
  .sem .shead .name { font-family: var(--display); font-weight: 700; font-size: 1.1rem; }
  .sem .shead .savg { font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
  .sem .shead .savg span { color: var(--dim); font-weight: 400; font-size: 0.78rem; }
  .grade-row { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
  .grade-row .gf { flex: 1; min-width: 0; }
  .grade-row .gf .gn { font-weight: 600; }
  .grade-row .gf .ge { color: var(--dim); font-size: 0.78rem; }
  .grade-row .gg { font-family: var(--display); font-weight: 800; font-size: 1.3rem; min-width: 48px; text-align: right; font-variant-numeric: tabular-nums; }
  .grade-row .del { background: none; border: none; color: var(--dim); font-size: 1.1rem; cursor: pointer; padding: 4px 8px; }
  .grade-row .del:active { color: var(--exam); }
  .gnote-1 { color: #2fd47a; } .gnote-2 { color: #8bd450; } .gnote-3 { color: #ffb454; } .gnote-4 { color: #ff8f56; } .gnote-5 { color: #ff6b6b; }
  .addbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 12px 0 6px; border-top: 1px dashed var(--line); margin-top: 4px; }
  .addbar input { background: var(--bg-2); border: 1px solid var(--line); color: var(--txt); border-radius: 10px; padding: 10px 12px; font-size: 0.95rem; font-family: var(--body); }
  .addbar input.fach { flex: 1; min-width: 120px; }
  .addbar input.note { width: 78px; text-align: center; }
  .addbar input.ects { width: 78px; text-align: center; }
  .addbar button.add { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border: none; border-radius: 10px; padding: 10px 16px; font-weight: 600; cursor: pointer; font-size: 0.95rem; }
  .gbtn { background: var(--card); border: 1px solid var(--line); color: var(--txt); border-radius: 12px; padding: 11px 16px; font-weight: 600; cursor: pointer; font-size: 0.9rem; }
  .gbtn:active { transform: scale(0.97); }
  .gactions { display: flex; gap: 10px; flex-wrap: wrap; margin: 6px 0 18px; }
  .addsem { width: 100%; background: var(--card); border: 1px dashed var(--line); color: var(--muted); border-radius: 14px; padding: 14px; font-weight: 600; cursor: pointer; font-size: 0.95rem; }
  .ghint { color: var(--dim); font-size: 0.8rem; margin: 4px 2px 16px; }
  /* WOCHE Umschalter + Raster */
  .wtoggle { display:flex; gap:4px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:4px; margin-bottom:14px; width:fit-content; }
  .wtoggle button { background:transparent; border:none; color:var(--muted); padding:8px 18px; border-radius:9px; font-weight:600; font-size:0.88rem; cursor:pointer; font-family:var(--body); }
  .wtoggle button.on { background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff; }
  .rgrid { display:grid; grid-template-columns:36px repeat(5,1fr); gap:5px; }
  .rhead { text-align:center; font-size:0.74rem; font-weight:700; color:var(--muted); padding:5px 0; }
  .rhead.today { color:var(--accent); }
  .rhead span { display:block; color:var(--dim); font-weight:500; font-size:0.68rem; }
  .rtime { font-size:0.6rem; color:var(--dim); font-variant-numeric:tabular-nums; display:flex; flex-direction:column; align-items:flex-end; justify-content:center; padding-right:3px; text-align:right; line-height:1.3; }
  .rcell { min-height:72px; background:rgba(255,255,255,0.02); border:1px solid var(--line); border-radius:9px; }
  html[data-theme="light"] .rcell { background:rgba(0,0,0,0.02); }
  .rtile { min-height:72px; border:1px solid transparent; border-radius:9px; padding:7px 5px; display:flex; flex-direction:column; gap:2px; cursor:pointer; position:relative; overflow:hidden; transition:transform .12s; }
  .rtile:active { transform:scale(0.95); }
  .rtile .rk { font-family:var(--display); font-weight:800; font-size:0.92rem; line-height:1; }
  .rtile .rr { font-size:0.6rem; color:var(--muted); }
  .rtile.multi::after { content:"2"; position:absolute; top:3px; right:4px; font-size:0.52rem; background:rgba(0,0,0,0.25); width:13px; height:13px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; }
  .rtile.special { background:rgba(255,255,255,0.03); color:var(--dim); align-items:center; justify-content:center; text-align:center; }
  .rtile.special .rk { font-size:0.6rem; font-weight:600; }
  .rlegend { color:var(--dim); font-size:0.72rem; line-height:1.6; margin-top:16px; }
  /* Detail-Sheet */
  .sheet-bg { position:fixed; inset:0; background:rgba(0,0,0,0.5); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); display:none; align-items:flex-end; justify-content:center; z-index:60; }
  .sheet-bg.open { display:flex; }
  .sheet { background:var(--card); border:1px solid var(--line); border-radius:24px 24px 0 0; padding:24px 22px calc(30px + env(safe-area-inset-bottom)); width:100%; max-width:760px; animation:sheetup .25s ease; }
  @keyframes sheetup { from{transform:translateY(100%);} to{transform:none;} }
  .sheet .sk { font-family:var(--display); font-weight:800; font-size:1.6rem; }
  .sheet .srow { display:flex; justify-content:space-between; gap:12px; padding:11px 0; border-top:1px solid var(--line); margin-top:6px; }
  .sheet .srow .l { color:var(--muted); } .sheet .srow .v { font-weight:600; text-align:right; }
  .sheet .close { width:100%; margin-top:18px; background:var(--line); color:var(--txt); border:none; padding:13px; border-radius:12px; font-weight:600; font-size:0.95rem; cursor:pointer; }
</style>
</head>
<body>
<div class="header">
  <div>
    <h1>Stundenplan <span class="kurs">WVS2024/4</span></h1>
    <div class="clock" id="clock">—</div>
  </div>
  <button class="theme-btn" id="theme" title="Hell/Dunkel">🌙</button>
</div>
<div id="app"><div class="status"><div class="spinner"></div>Lade Plan …</div></div>
<nav class="tabs">
  <button data-view="now" class="active">Jetzt</button>
  <button data-view="week">Woche</button>
  <button data-view="exams">Klausuren</button>
  <button data-view="grades">Noten</button>
</nav>
<div class="sheet-bg" id="tilesheetbg" onclick="if(event.target===this)closeTile()"><div class="sheet" id="tilesheet"></div></div>
<script>
const MONTHS = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
const WD = ["So","Mo","Di","Mi","Do","Fr","Sa"];
const WD_FULL = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const FACH_COLORS = {
  "FDL-Marketing":"#5b8cff","Organisation":"#2fd47a","Personal":"#ffb454","Recht":"#ff6b6b",
  "Regulierung":"#8b6cff","RisikoMgt":"#22c3e6","VWL":"#ff8fb1","VersMathe":"#4cd9a0",
  "Wiss.Theorie":"#c792ea","WissArb":"#e6a23c"
};
function fachColor(f){ if(FACH_COLORS[f]) return FACH_COLORS[f]; let h=0; for(const c of (f||"")) h=(h*31+c.charCodeAt(0))%360; return `hsl(${h} 70% 62%)`; }
const FACH_KURZ = {
  "FDL-Marketing":"FDL","Organisation":"ORG","Personal":"PERS","Recht":"RE",
  "Regulierung":"REG","RisikoMgt":"RM","VWL":"VWL","VersMathe":"VMA",
  "Wiss.Theorie":"WT","WissArb":"WA"
};
function fachKurz(f){ if(FACH_KURZ[f]) return FACH_KURZ[f]; return (f||"").replace(/[^A-Za-zÄÖÜ]/g,"").slice(0,3).toUpperCase(); }
let weekMode = "list"; // "list" | "grid"
let DATA=null, weekOffset=0, activeView="now";
function parseDate(s){ const m=(s||"").match(/(\d{2})\.(\d{2})\.(\d{4})/); return m?new Date(+m[3],+m[2]-1,+m[1]):null; }
function parseTime(d,hhmm){ const [h,mi]=hhmm.split(":").map(Number); const x=new Date(d); x.setHours(h,mi,0,0); return x; }
function fmtDateShort(d){ return `${d.getDate()}. ${MONTHS[d.getMonth()]}`; }
function sameDay(a,b){ return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate(); }
function startOfWeek(d){ const x=new Date(d); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); x.setHours(0,0,0,0); return x; }
function daysUntil(d){ const t=new Date(); t.setHours(0,0,0,0); const x=new Date(d); x.setHours(0,0,0,0); return Math.round((x-t)/86400000); }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function cdText(du){ if(du<0) return "vorbei"; if(du===0) return "heute"; if(du===1) return "morgen"; return "in "+du+" Tagen"; }
function applyTheme(t){ document.documentElement.setAttribute("data-theme",t); document.getElementById("theme").textContent=t==="dark"?"☀️":"🌙"; }
function initTheme(){ let saved=null; try{ saved=localStorage.getItem("theme"); }catch(e){} const sys=window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"; applyTheme(saved||sys); }
document.getElementById("theme").addEventListener("click",()=>{ const cur=document.documentElement.getAttribute("data-theme"); const next=cur==="dark"?"light":"dark"; applyTheme(next); try{ localStorage.setItem("theme",next); }catch(e){} });
function tickClock(){ const n=new Date(); document.getElementById("clock").textContent=`${WD_FULL[n.getDay()]}, ${n.getDate()}. ${MONTHS[n.getMonth()]} ${n.getFullYear()} · ${String(n.getHours()).padStart(2,"0")}:${String(n.getMinutes()).padStart(2,"0")}`; }
async function load(){
  try{ const res=await fetch("data.json?_="+Date.now(),{cache:"no-store"}); if(!res.ok) throw new Error("HTTP "+res.status);
    DATA=await res.json(); try{ localStorage.setItem("plan_cache",JSON.stringify(DATA)); }catch(e){} render();
  }catch(e){ let cached=null; try{ cached=JSON.parse(localStorage.getItem("plan_cache")); }catch(_){} if(cached){ DATA=cached; render(true); } else showError(e.message); }
}
function showError(msg){ document.getElementById("app").innerHTML=`<div class="err-box"><b>Plan konnte nicht geladen werden.</b><br><br>Fehler: <code>${esc(msg)}</code><br><br>Prüfe, ob <code>data.json</code> im Repo liegt und der tägliche Abruf (Actions) gelaufen ist.</div>`; }
function vEntries(){ return DATA?DATA.vorlesung.eintraege:[]; }
function entriesFor(date){ return vEntries().filter(e=>{const d=parseDate(e.datum);return d&&sameDay(d,date);}).sort((a,b)=>a.block-b.block); }
function groupedFor(date){
  const list=entriesFor(date); const map=new Map();
  for(const e of list){
    if(e.special){ map.set("sp_"+e.fach,{datum:e.datum,start:e.start,ende:e.ende,block:e.block,special:true,fach:e.fach,faecher:[]}); continue; }
    const key=e.block+"|"+e.start;
    if(!map.has(key)) map.set(key,{datum:e.datum,start:e.start,ende:e.ende,block:e.block,special:false,faecher:[]});
    map.get(key).faecher.push({fach:e.fach,dozent:e.dozent,raum:e.raum});
  }
  return [...map.values()].sort((a,b)=>a.block-b.block);
}
function examsFor(date){ return (DATA?DATA.klausur.klausuren:[]).filter(k=>{const d=parseDate(k.datum);return d&&sameDay(d,date);}); }
function festExams(){ return (DATA?DATA.klausur.klausuren:[]).filter(k=>k.termin_fest&&parseDate(k.datum)).sort((a,b)=>parseDate(a.datum)-parseDate(b.datum)); }
function nextExam(){ const now=new Date(); now.setHours(0,0,0,0); return festExams().find(k=>parseDate(k.datum)>=now)||null; }
function renderNow(){
  const now=new Date(); const groups=groupedFor(now).filter(g=>!g.special); let current=null;
  for(const g of groups){ const s=parseTime(parseDate(g.datum),g.start), en=parseTime(parseDate(g.datum),g.ende); if(now>=s&&now<=en){current=g;break;} }
  let html="";
  const ne=nextExam();
  if(ne){ const d=parseDate(ne.datum), du=daysUntil(d); const mod=ne.modul.split(" - ")[0];
    html+=`<div class="examalert"><div class="ic">📝</div><div><div class="t1">Nächste Klausur</div><div class="t2">${esc(mod)}</div></div><div class="cd">${cdText(du)}<span>${WD[d.getDay()]}, ${fmtDateShort(d)} · ${esc(ne.zeit)}</span></div></div>`; }
  if(current){
    const s=parseTime(parseDate(current.datum),current.start), en=parseTime(parseDate(current.datum),current.ende);
    const total=en-s, done=now-s, pct=Math.max(0,Math.min(100,Math.round(done/total*100))); const restMin=Math.max(0,Math.round((en-now)/60000));
    const multi=current.faecher.length>1;
    const cols=current.faecher.map(f=>fachColor(f.fach));
    const swatch = cols.length>1 ? `linear-gradient(${cols.join(",")})` : cols[0];
    const titel = multi ? current.faecher.map(f=>esc(f.fach)).join(" / ") : esc(current.faecher[0].fach);
    let metaLine;
    if(multi){ metaLine=`${current.faecher.map(f=>esc(f.fach)+(f.dozent?" ("+esc(f.dozent)+")":"")).join(" · ")}<br><b>${current.start}–${current.ende}</b> · Raum <b>${esc(current.faecher[0].raum)}</b>`; }
    else { const f=current.faecher[0]; metaLine=`${f.dozent?"bei <b>"+esc(f.dozent)+"</b> · ":""}<b>${current.start}–${current.ende}</b> · Raum <b>${esc(f.raum)}</b>`; }
    html+=`<div class="hero live"><div class="badge"><span class="dot"></span>Läuft gerade</div><div class="fach"><span class="swatch" style="background:${swatch}"></span>${titel}</div><div class="meta">${metaLine}</div>${multi?'<div class="meta" style="color:var(--warn);font-size:0.85rem;margin-top:6px;">⚠ Zwei Fächer in diesem Block – genaue Aufteilung siehe Aushang</div>':''}<div class="progress"><div class="bar"><div class="fill" style="width:${pct}%"></div></div><div class="lbl"><span>${current.start}</span><span>noch ${restMin} Min</span><span>${current.ende}</span></div></div></div>`;
  } else {
    const later=groups.some(g=>parseTime(parseDate(g.datum),g.start)>now);
    html+=`<div class="hero"><span class="empty-big">${later?"Gerade Pause":"Keine Vorlesung gerade"}</span><span class="empty-sub">${later?"Die nächste Veranstaltung steht unten.":"Genieß die freie Zeit."}</span></div>`;
  }
  if(groups.length){
    html+=`<div class="label">Heute</div>`;
    for(const g of groups){ const s=parseTime(parseDate(g.datum),g.start), en=parseTime(parseDate(g.datum),g.ende); const isNow=now>=s&&now<=en, past=now>en; html+=groupRowHTML(g,{isNow,past}); }
    for(const k of examsFor(now)) html+=examRowHTML(k);
  } else {
    for(let i=1;i<=21;i++){ const d=new Date(now); d.setDate(d.getDate()+i); const gl=groupedFor(d).filter(g=>!g.special);
      if(gl.length){ html+=`<div class="label">Nächster Tag · ${WD_FULL[d.getDay()]}, ${fmtDateShort(d)}</div>`; for(const g of gl) html+=groupRowHTML(g,{}); break; } }
  }
  return html;
}
function groupRowHTML(g,{isNow=false,past=false}={}){
  if(g.special) return `<div class="row special"><div class="time">—</div><div class="body"><div class="f">${esc(g.fach)}</div></div></div>`;
  const multi=g.faecher.length>1;
  // Streifen: bei mehreren Fächern ein Verlauf aus den Fachfarben
  const cols=g.faecher.map(f=>fachColor(f.fach));
  const stripe = cols.length>1 ? `linear-gradient(${cols.join(",")})` : cols[0];
  let bodyInner;
  if(multi){
    const names=g.faecher.map(f=>esc(f.fach)).join(" / ");
    const det=g.faecher.map(f=>`${esc(f.fach)}${f.dozent?" ("+esc(f.dozent)+")":""}`).join(" · ");
    bodyInner=`<div class="f">${names}</div><div class="d">${det} · <span class="r">Raum ${esc(g.faecher[0].raum)}</span></div><div class="d" style="color:var(--warn);font-size:0.78rem;margin-top:4px;">⚠ Zwei Fächer im selben Block – genaue Aufteilung siehe Aushang</div>`;
  } else {
    const f=g.faecher[0];
    bodyInner=`<div class="f">${esc(f.fach)}</div><div class="d">${f.dozent?esc(f.dozent)+" · ":""}<span class="r">Raum ${esc(f.raum)}</span></div>`;
  }
  return `<div class="row ${isNow?"now":""}" style="${past?"opacity:.5":""}"><span class="stripe" style="background:${stripe}"></span><div class="time">${g.start}<span class="end">${g.ende}</span></div><div class="body">${isNow?'<div class="nowtag">● jetzt</div>':""}${bodyInner}</div></div>`;
}
function examRowHTML(k){ return `<div class="row examrow"><span class="stripe" style="background:var(--exam)"></span><div class="time">${esc((k.zeit||"").split("-")[0])}<span class="end">Klausur</span></div><div class="body"><div class="f">📝 ${esc(k.modul.split(" - ")[0])}</div><div class="d">${k.dozent?esc(k.dozent)+" · ":""}<span class="r">${esc(k.raum||"")}</span></div></div></div>`; }
function renderExams(){
  const meta=DATA.klausur.meta||{}; const fest=festExams(); const soft=DATA.klausur.klausuren.filter(k=>!k.termin_fest); let html="";
  if(meta.zeitraum||meta.ort) html+=`<div class="label">Prüfungszeitraum ${esc(meta.zeitraum||"")} · ${esc(meta.ort||"")}</div>`;
  for(const k of fest){ const d=parseDate(k.datum), du=daysUntil(d); const mod=k.modul.split(" - ");
    html+=`<div class="exam"><div class="top-line"><div class="dt">${WD[d.getDay()]}, ${fmtDateShort(d)}</div><div class="cd">${cdText(du)}</div></div><div class="mod">${esc(mod[0])}</div>${mod.length>1?`<div class="sub">${esc(mod.slice(1).join(" · "))}</div>`:""}<div class="grid"><span class="chip">🕐 <b>${esc(k.zeit)}</b></span>${k.raum?`<span class="chip">📍 <b>${esc(k.raum)}</b></span>`:""}${k.dozent?`<span class="chip">👤 <b>${esc(k.dozent)}</b></span>`:""}</div></div>`; }
  if(soft.length){ html+=`<div class="label">Ohne festen Termin</div>`;
    for(const k of soft){ const mod=k.modul.split(" - "); html+=`<div class="exam soft"><div class="mod">${esc(mod[0])}</div>${mod.length>1?`<div class="sub">${esc(mod.slice(1).join(" · "))}</div>`:""}<div class="grid">${k.dozent?`<span class="chip">👤 <b>${esc(k.dozent)}</b></span>`:""}${k.hinweis?`<span class="chip">${esc(k.hinweis)}</span>`:""}</div></div>`; } }
  return html||`<div class="status">Keine Klausuren gefunden.</div>`;
}
function renderWeek(){
  const base=startOfWeek(new Date()); base.setDate(base.getDate()+weekOffset*7); const today=new Date();
  let kw=""; for(let i=0;i<5;i++){ const d=new Date(base); d.setDate(d.getDate()+i); const l=entriesFor(d); if(l.length){kw=l[0].kw;break;} }
  const toggle=`<div class="wtoggle"><button class="${weekMode==='list'?'on':''}" onclick="setWeekMode('list')">Liste</button><button class="${weekMode==='grid'?'on':''}" onclick="setWeekMode('grid')">Raster</button></div>`;
  const nav=`<div class="weeknav"><button onclick="changeWeek(-1)">‹</button><div class="wk">${fmtDateShort(base)} – ${fmtDateShort(new Date(base.getTime()+4*86400000))}<span>${kw?"KW "+kw:""}${weekOffset===0?" · diese Woche":""}</span></div><button onclick="changeWeek(1)">›</button></div>`;
  if(weekMode==="grid") return toggle+nav+renderWeekGrid(base,today);
  let html=toggle+nav+`<div class="weekgrid">`;
  for(let i=0;i<5;i++){ const d=new Date(base); d.setDate(d.getDate()+i); const groups=groupedFor(d); const ex=examsFor(d); const isToday=sameDay(d,today);
    html+=`<div class="day"><h3 class="${isToday?"today":""}">${WD_FULL[d.getDay()]} <span>${fmtDateShort(d)}${isToday?" · heute":""}</span></h3>`;
    if(!groups.length&&!ex.length){ html+=`<div class="nothing">frei</div>`; } else { for(const g of groups) html+=groupRowHTML(g,{}); for(const k of ex) html+=examRowHTML(k); }
    html+=`</div>`; }
  html+=`</div>`; return html;
}
function renderWeekGrid(base,today){
  const BLOCKS=[["08:30","11:45"],["12:30","15:45"],["16:00","17:30"]];
  let h=`<div class="rgrid"><div></div>`;
  for(let i=0;i<5;i++){ const d=new Date(base); d.setDate(d.getDate()+i); const isToday=sameDay(d,today);
    h+=`<div class="rhead ${isToday?'today':''}">${WD[d.getDay()]}<span>${d.getDate()}.${d.getMonth()+1}.</span></div>`; }
  for(let b=0;b<3;b++){
    h+=`<div class="rtime">${BLOCKS[b][0]}<br>${BLOCKS[b][1]}</div>`;
    for(let i=0;i<5;i++){ const d=new Date(base); d.setDate(d.getDate()+i);
      const groups=groupedFor(d).filter(g=>g.block===b);
      // Klausuren dem zeitlich passenden Block zuordnen: <12h->0, 12-15:59->1, >=16h->2
      const exHere=examsFor(d).filter(k=>{ const hh=parseInt((k.zeit||"").slice(0,2),10); const blk = isNaN(hh)?0 : hh<12?0 : hh<16?1 : 2; return blk===b; });
      if(exHere.length){
        const k=exHere[0];
        h+=`<div class="rtile" style="background:color-mix(in srgb,var(--exam) 16%,transparent);border-color:color-mix(in srgb,var(--exam) 40%,transparent);color:var(--exam)" onclick='openTile(${esc(JSON.stringify({exam:true,modul:k.modul,zeit:k.zeit,raum:k.raum,dozent:k.dozent})).replace(/'/g,"&#39;")})'><div class="rk">📝</div><div class="rr">${esc((k.zeit||"").split("-")[0])}</div></div>`;
        continue;
      }
      if(!groups.length){ h+=`<div class="rcell"></div>`; continue; }
      const g=groups[0];
      if(g.special){ h+=`<div class="rtile special"><div class="rk">${esc(g.fach.length>9?g.fach.slice(0,8)+'…':g.fach)}</div></div>`; continue; }
      const multi=g.faecher.length>1;
      const f=g.faecher[0]; const col=fachColor(f.fach); const kurz=fachKurz(f.fach);
      const payload={multi,start:g.start,ende:g.ende,faecher:g.faecher};
      h+=`<div class="rtile ${multi?'multi':''}" style="background:color-mix(in srgb,${col} 16%,transparent);border-color:color-mix(in srgb,${col} 40%,transparent);color:${col}" onclick='openTile(${esc(JSON.stringify(payload)).replace(/'/g,"&#39;")})'><div class="rk">${kurz}</div><div class="rr">${esc(f.raum)}</div></div>`;
    }
  }
  h+=`</div><div class="rlegend">Tippe eine Kachel für Details · Kürzel: ${Object.entries(FACH_KURZ).map(([k,v])=>v+"="+k).join(" · ")}</div>`;
  return h;
}
function setWeekMode(m){ weekMode=m; try{ localStorage.setItem("weekmode",m); }catch(e){} render(); }
function openTile(data){
  let inner;
  if(data.exam){
    const mod=data.modul.split(" - ");
    inner=`<div class="sk" style="color:var(--exam)">📝 ${esc(mod[0])}</div>${mod.length>1?`<div style="color:var(--muted);margin-top:4px;">${esc(mod.slice(1).join(" · "))}</div>`:""}
      <div class="srow"><span class="l">Zeit</span><span class="v">${esc(data.zeit)}</span></div>
      <div class="srow"><span class="l">Raum</span><span class="v">${esc(data.raum||"–")}</span></div>
      <div class="srow"><span class="l">Dozent</span><span class="v">${esc(data.dozent||"–")}</span></div>`;
  } else {
    const titel=data.faecher.map(f=>esc(f.fach)).join(" / ");
    const col=fachColor(data.faecher[0].fach);
    inner=`<div class="sk" style="color:${col}">${titel}</div>
      <div class="srow"><span class="l">Zeit</span><span class="v">${data.start}–${data.ende}</span></div>`;
    for(const f of data.faecher){ inner+=`<div class="srow"><span class="l">${esc(f.fach)}</span><span class="v">${f.dozent?esc(f.dozent):"–"} · ${esc(f.raum)}</span></div>`; }
    if(data.multi) inner+=`<div style="color:var(--warn);font-size:0.85rem;margin-top:12px;">⚠ Zwei Fächer im selben Block – genaue Aufteilung siehe Aushang</div>`;
  }
  document.getElementById("tilesheet").innerHTML=inner+`<button class="close" onclick="closeTile()">Schließen</button>`;
  document.getElementById("tilesheetbg").classList.add("open");
}
function closeTile(){ document.getElementById("tilesheetbg").classList.remove("open"); }
function changeWeek(d){ weekOffset+=d; render(); }

// ============ NOTEN ============
// --- Speicher gekapselt: NUR hier wird gespeichert/geladen. Für Cloud später nur diese 2 Funktionen tauschen. ---
function loadNotes(){
  try{ const raw=localStorage.getItem("grades_v1"); if(raw) return JSON.parse(raw); }catch(e){}
  return { semesters: [ {id:Date.now(), name:"1. Semester", grades:[]} ] };
}
function saveNotes(data){
  try{ localStorage.setItem("grades_v1", JSON.stringify(data)); }catch(e){ alert("Speichern fehlgeschlagen – evtl. Speicher voll oder privater Modus."); }
}
let GRADES = null;

function gradeClass(n){ const r=Math.round(n); return "gnote-"+Math.min(5,Math.max(1,r)); }
// gewichteter (falls ECTS) oder einfacher Schnitt
function avg(grades){
  const valid=grades.filter(g=>typeof g.note==="number"&&!isNaN(g.note));
  if(!valid.length) return null;
  const anyEcts=valid.some(g=>g.ects>0);
  if(anyEcts){ let sum=0,w=0; for(const g of valid){ const e=g.ects>0?g.ects:1; sum+=g.note*e; w+=e; } return sum/w; }
  return valid.reduce((a,g)=>a+g.note,0)/valid.length;
}
function fmtNote(n){ return n==null?"–":n.toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function allGrades(){ return GRADES.semesters.flatMap(s=>s.grades); }

function renderGrades(){
  if(!GRADES) GRADES=loadNotes();
  const total=avg(allGrades());
  const totalCount=allGrades().filter(g=>typeof g.note==="number").length;
  let html=`<div class="gpa-cards">
    <div class="gpa total"><div class="t">Gesamtschnitt</div><div class="v ${total!=null?gradeClass(total):""}">${fmtNote(total)}</div><div class="sub">${totalCount} Fächer gesamt</div></div>
    <div class="gpa"><div class="t">Semester</div><div class="v">${GRADES.semesters.length}</div><div class="sub">angelegt</div></div>
  </div>`;
  html+=`<div class="gactions">
    <button class="gbtn" onclick="exportNotes()">⬇ Noten sichern (Export)</button>
    <button class="gbtn" onclick="document.getElementById('importfile').click()">⬆ Noten laden (Import)</button>
    <input type="file" id="importfile" accept=".json,application/json" style="display:none" onchange="importNotes(event)">
  </div>`;
  html+=`<div class="ghint">Tipp: ECTS sind optional. Lässt du sie leer, wird ein einfacher Durchschnitt gerechnet; mit ECTS wird gewichtet (wie an der DHBW). Noten von 1,0 (beste) bis 5,0.</div>`;

  for(const s of GRADES.semesters){
    const sa=avg(s.grades);
    html+=`<div class="sem"><div class="shead">
      <div class="name" contenteditable="true" onblur="renameSem(${s.id}, this.innerText)">${esc(s.name)}</div>
      <div class="savg">⌀ ${sa!=null?`<span style="color:inherit">${fmtNote(sa)}</span>`:`<span>noch leer</span>`}</div></div>`;
    for(const g of s.grades){
      html+=`<div class="grade-row">
        <div class="gf"><div class="gn">${esc(g.fach)}</div>${g.ects>0?`<div class="ge">${g.ects} ECTS</div>`:""}</div>
        <div class="gg ${gradeClass(g.note)}">${g.note.toLocaleString("de-DE",{minimumFractionDigits:1})}</div>
        <button class="del" onclick="delGrade(${s.id},${g.id})" title="Löschen">✕</button></div>`;
    }
    html+=`<div class="addbar">
      <input class="fach" id="f_${s.id}" placeholder="Fach" />
      <input class="note" id="n_${s.id}" inputmode="decimal" placeholder="Note" />
      <input class="ects" id="e_${s.id}" inputmode="numeric" placeholder="ECTS" />
      <button class="add" onclick="addGrade(${s.id})">+</button>
    </div></div>`;
  }
  html+=`<button class="addsem" onclick="addSem()">+ Semester hinzufügen</button>`;
  return html;
}
function persistAndRerender(){ saveNotes(GRADES); render(); }
function addSem(){ const n=GRADES.semesters.length+1; GRADES.semesters.push({id:Date.now(), name:n+". Semester", grades:[]}); persistAndRerender(); }
function renameSem(id,name){ const s=GRADES.semesters.find(x=>x.id===id); if(s){ s.name=(name||"").trim()||s.name; saveNotes(GRADES); } }
function addGrade(sid){
  const s=GRADES.semesters.find(x=>x.id===sid); if(!s) return;
  const fEl=document.getElementById("f_"+sid), nEl=document.getElementById("n_"+sid), eEl=document.getElementById("e_"+sid);
  const fach=(fEl.value||"").trim();
  const note=parseFloat((nEl.value||"").replace(",","."));
  const ects=parseFloat((eEl.value||"").replace(",","."))||0;
  if(!fach){ fEl.focus(); return; }
  if(isNaN(note)||note<1||note>5){ alert("Bitte eine Note zwischen 1,0 und 5,0 eingeben."); nEl.focus(); return; }
  s.grades.push({id:Date.now(), fach, note, ects: ects>0?ects:0});
  persistAndRerender();
}
function delGrade(sid,gid){ const s=GRADES.semesters.find(x=>x.id===sid); if(!s) return; s.grades=s.grades.filter(g=>g.id!==gid); persistAndRerender(); }

function exportNotes(){
  const blob=new Blob([JSON.stringify(GRADES,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob); const a=document.createElement("a");
  const stamp=new Date().toISOString().slice(0,10);
  a.href=url; a.download="noten-"+stamp+".json"; a.click(); URL.revokeObjectURL(url);
}
function importNotes(ev){
  const file=ev.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.semesters)) throw new Error("Falsches Format");
      GRADES=d; saveNotes(GRADES); render(); alert("Noten erfolgreich geladen.");
    }catch(e){ alert("Import fehlgeschlagen: "+e.message); } };
  r.readAsText(file);
}

function render(offline=false){
  document.body.classList.toggle("wide", activeView==="week");
  if(activeView==="grades"){ document.getElementById("app").innerHTML=`<div class="view">${renderGrades()}</div>`; return; }
  if(!DATA) return;
  let inner=activeView==="now"?renderNow():activeView==="week"?renderWeek():renderExams();
  const off=offline?`<div class="offline">⚠ Offline – zeige zuletzt gespeicherte Version</div>`:"";
  const stand=DATA.stand?`<div class="stand">Daten aktualisiert: ${new Date(DATA.stand).toLocaleString("de-DE")}</div>`:"";
  document.getElementById("app").innerHTML=`<div class="view">${off}${inner}${stand}</div>`;
}
document.querySelectorAll(".tabs button").forEach(btn=>btn.addEventListener("click",()=>{ document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active")); btn.classList.add("active"); activeView=btn.dataset.view; if(activeView!=="week") weekOffset=0; render(); }));
initTheme(); try{ const wm=localStorage.getItem("weekmode"); if(wm) weekMode=wm; }catch(e){} tickClock(); setInterval(tickClock,10000); setInterval(()=>{ if(activeView==="now") render(); },30000); load();
